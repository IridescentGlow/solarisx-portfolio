<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0B0A09" />

    <title>Dagim Demissie — Visual Storyteller & Creative Technologist</title>
    <meta
      name="description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <meta name="author" content="Dagim Demissie" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solarisx" />
    <meta
      property="og:title"
      content="Dagim Demissie — Visual Storyteller & Creative Technologist"
    />
    <meta
      property="og:description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <meta property="og:locale" content="en_US" />
    <!-- TODO(content): add og:url once the site is deployed, and og:image
         (1200x630) once a share image exists. Link previews stay text-only
         until both are set. -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dagim Demissie — Visual Storyteller & Creative Technologist"
    />
    <meta
      name="twitter:description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <!-- TODO(content): add twitter:image (same asset as og:image). Without it
         this card renders as a small summary rather than large image. -->
    <!-- Theme, resolved before first paint. This has to be inline and
         blocking: anything that waits for the JS bundle paints the default
         theme first, and a light-mode visitor sees a full-screen black
         flash. Mirrors resolveTheme()/applyTheme() in src/lib/theme.js —
         that module cannot be imported here for the same reason. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("solarisx-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", theme === "light" ? "#efebe2" : "#0b0a09");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
