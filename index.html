<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0B0A09" />

    <meta name="author" content="Dagim Demissie" />

    <!-- Share metadata. Everything between the markers is REPLACED PER ROUTE
         at build time by scripts/prerender-meta.mjs, from the single source of
         truth in src/lib/seo.js — do not hand-edit the copy here, edit that.
         What is written below is the home route's output, which is what the
         dev server (and any route with no pre-rendered file) serves; the
         runtime hook in src/lib/useDocumentMeta.js corrects it on client-side
         navigation. Removing the markers fails the build deliberately.
         og:url and canonical are absent because no deployment origin exists
         yet — set SITE_URL in src/lib/seo.js and both start being emitted. -->
    <!-- seo:start -->
    <title>Dagim Demissie — Visual Storyteller &amp; Creative Technologist</title>
    <meta
      name="description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solarisx" />
    <meta
      property="og:title"
      content="Dagim Demissie — Visual Storyteller &amp; Creative Technologist"
    />
    <meta
      property="og:description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <meta property="og:image" content="/assets/projects/reel-poster.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dagim Demissie — Visual Storyteller &amp; Creative Technologist"
    />
    <meta
      name="twitter:description"
      content="I combine storytelling, visual design and technology to build experiences people remember. Editing, motion design, and interactive work."
    />
    <meta name="twitter:image" content="/assets/projects/reel-poster.jpg" />
    <!-- seo:end -->

    <!-- Theme, resolved before first paint. This has to be inline and
         blocking: anything that waits for the JS bundle paints the default
         theme first, and a light-mode visitor sees a full-screen black
         flash. Mirrors resolveTheme()/applyTheme() in src/lib/theme.js —
         that module cannot be imported here for the same reason. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("solarisx-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", theme === "light" ? "#efebe2" : "#0b0a09");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
